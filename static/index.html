<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DJ Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1319">
<style>
  /* Dark is the default ground. Every colour flows through these tokens, so a
     theme is a second block rather than a sweep through the stylesheet.
     color-scheme is set too, or the native time / number / range controls
     render as dark widgets on a light page. */
  :root {
    color-scheme: dark;
    --ground:   #0F1319;
    --panel:    #171C24;
    --panel-2:  #1E242E;
    --line:     #29313C;
    --ink:      #E9ECEF;
    --ink-2:    #A8B2BF;
    --muted:    #7D8896;
    --faint:    #333B45;
    --accent:      #9BD3A0;
    --accent-soft: #3E5A42;
    --accent-2:    #E7AFC4;
    --on-accent:   #14181D;

    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Light is not an inversion: the amber darkens so it still reads on a pale
     ground, and takes white text instead of near-black. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --ground:   #E7EAEE;
      --panel:    #FFFFFF;
      --panel-2:  #F1F4F7;
      --line:     #D3D9E0;
      --ink:      #141821;
      --ink-2:    #414C5A;
      --muted:    #59636F;
      --faint:    #C6CDD6;
      --accent:      #6B4423;
      --accent-soft: #D8C4B0;
      --accent-2:    #3F6B4C;
      --on-accent:   #FFFFFF;
    }
  }

  /* An explicit choice wins over the OS in both directions. */
  :root[data-theme="light"] {
    color-scheme: light;
    --ground:   #E7EAEE;
    --panel:    #FFFFFF;
    --panel-2:  #F1F4F7;
    --line:     #D3D9E0;
    --ink:      #141821;
    --ink-2:    #414C5A;
    --muted:    #59636F;
    --faint:    #C6CDD6;
    --accent:    #6B4423;
    --accent-soft: #D8C4B0;
    --accent-2:    #3F6B4C;
    --on-accent:   #FFFFFF;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:   #0F1319;
    --panel:    #171C24;
    --panel-2:  #1E242E;
    --line:     #29313C;
    --ink:      #E9ECEF;
    --ink-2:    #A8B2BF;
    --muted:    #7D8896;
    --faint:    #333B45;
    --accent:      #9BD3A0;
    --accent-soft: #3E5A42;
    --accent-2:    #E7AFC4;
    --on-accent:   #14181D;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ============ Split shell ============
     Phone: content fills the screen, player pinned along the bottom.
     Wide:  the same player becomes a permanent sidebar. One markup, two modes. */
  .app {
    display: grid; height: 100dvh;
    grid-template-areas: "content" "player";
    grid-template-rows: 1fr auto;
  }
  @media (min-width: 760px) {
    .app {
      grid-template-areas: "player content";
      grid-template-columns: 300px 1fr;
      grid-template-rows: 1fr;
    }
  }

  /* ============ Player ============ */
  .player {
    grid-area: player; background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 7px; min-width: 0;
  }
  /* Phone: art + title + the four transport buttons already fill the width, and
     .transport does not shrink — so the volume row and the chips were being
     pushed off the right edge. Wrap, and give each of them a row of its own. */
  .player-main {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 8px 12px; min-width: 0;
  }
  .player-main > .vol, .player-main > .chips { flex: 1 0 100%; }
  @media (min-width: 760px) {
    .player {
      border-top: 0; border-right: 1px solid var(--line);
      gap: 14px; padding: 18px 16px; overflow-y: auto;
    }
    .player-main { flex-direction: column; align-items: stretch; gap: 14px; }
    /* In column mode a 100% basis would mean full *height*, not full width. */
    .player-main > .vol, .player-main > .chips { flex: none; }
  }

  /* Seek */
  .seek { display: flex; align-items: center; gap: 8px; }
  .seek input {
    flex: 1; min-width: 0; accent-color: var(--accent); height: 18px; margin: 0;
  }
  .seek .t {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    font-variant-numeric: tabular-nums; min-width: 32px;
  }
  .seek .t.right { text-align: right; }
  .seek[data-idle="true"] { opacity: .4; pointer-events: none; }

  .art {
    width: 46px; height: 46px; flex-shrink: 0; border-radius: 6px;
    background: linear-gradient(140deg, var(--accent-soft), var(--panel-2));
    object-fit: cover; display: block;
  }
  @media (min-width: 760px) { .art { width: 100%; height: auto; aspect-ratio: 1; } }

  .np { min-width: 0; flex: 1; }
  .np-title {
    font-weight: 650; font-size: 14px; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .np-sub {
    font-size: 12px; color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .np-album { font-size: 11px; color: var(--muted); display: none; }
  @media (min-width: 760px) {
    .np-title { font-size: 16px; white-space: normal; }
    .np-sub { white-space: normal; }
    .np-album { display: block; }
  }

  .transport { display: flex; gap: 6px; flex-shrink: 0; }
  @media (min-width: 760px) { .transport { display: grid; grid-template-columns: repeat(4, 1fr); } }
  .tbtn {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    width: 40px; height: 40px; display: grid; place-items: center; font-size: 15px;
  }
  @media (min-width: 760px) { .tbtn { width: auto; height: 42px; } }
  .tbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .tbtn:active { transform: scale(.94); }

  .vol { display: flex; align-items: center; gap: 7px; }
  .vol input { flex: 1; min-width: 0; accent-color: var(--accent); height: 24px; margin: 0; }
  .vbtn {
    flex: none; width: 30px; height: 30px; border-radius: 7px;
    display: grid; place-items: center; font-size: 15px; line-height: 1;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
  }
  .vbtn:active { background: var(--accent-soft); }
  .vbtn.shuf.on {
    background: color-mix(in srgb, var(--accent) 26%, var(--panel-2));
    border-color: var(--accent); color: var(--accent);
  }
  /* Fixed width so the slider does not twitch sideways as the number goes
     from 9 to 10 to 100 while being dragged. */
  .vol .num {
    flex: none; min-width: 22px; text-align: right;
    font-variant-numeric: tabular-nums; font-size: 11px; letter-spacing: 0;
  }
  @media (min-width: 760px) {
    .vol input { height: 18px; }
    .vbtn { width: 24px; height: 24px; font-size: 13px; }
  }
  .lbl {
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
  }

  .chips { display: flex; flex-direction: row; gap: 6px; min-width: 0; }
  @media (min-width: 760px) {
    .chips { flex-direction: column; margin-top: auto; }
  }
  .chip {
    font-family: var(--mono); font-size: 10.5px; padding: 4px 8px; border-radius: 5px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2);
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  @media (min-width: 760px) { .chip { font-size: 11px; flex: none; } }

  /* ============ Content ============ */
  .content { grid-area: content; display: flex; flex-direction: column; min-height: 0; min-width: 0; }

  .tabs {
    display: flex; gap: 2px; padding: 8px 10px 0; flex-shrink: 0;
    border-bottom: 1px solid var(--line); overflow-x: auto;
  }
  .tab {
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 9px 12px; color: var(--muted); font-size: 13px; white-space: nowrap;
  }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

  .pane { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .pane[data-active="true"] { display: flex; }
  .pane-scroll { overflow-y: auto; flex: 1; min-height: 0; padding: 12px; }
  .pane-fixed { padding: 12px 12px 0; flex-shrink: 0; }

  .status {
    font-size: 12px; color: var(--ink-2); padding: 6px 12px 8px; flex-shrink: 0;
    min-height: 1.2em;
  }

  .searchbar { display: flex; gap: 6px; }
  .searchbar input {
    flex: 1; padding: 11px 12px; border-radius: 9px; min-width: 0;
    background: var(--panel); border: 1px solid var(--line);
  }
  .searchbar input::placeholder { color: var(--muted); }
  .btn {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 9px; padding: 11px 13px; font-size: 13px; white-space: nowrap;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.wide { width: 100%; }

  /* rows */
  .row {
    display: flex; align-items: center; gap: 10px; padding: 9px 8px;
    border-bottom: 1px solid var(--line); min-width: 0;
  }
  .row:last-child { border-bottom: 0; }
  .row-num {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    min-width: 26px; text-align: right; font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  .row-body { flex: 1; min-width: 0; }
  .row-title { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-sub {
    font-size: 11.5px; color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-acts { display: flex; gap: 4px; flex-shrink: 0; }
  .abtn {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    width: 30px; height: 30px; display: grid; place-items: center; font-size: 13px;
  }
  .abtn.go { background: color-mix(in srgb, var(--accent) 22%, var(--panel-2)); border-color: var(--accent-soft); }

  .row.played { opacity: .42; }
  .row.current { background: color-mix(in srgb, var(--accent-2) 14%, transparent); }
  .row.current .row-num { color: var(--accent-2); }

  .empty { color: var(--muted); font-size: 13px; padding: 22px 10px; text-align: center; }
  .group {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted);
    margin: 16px 0 5px; padding-bottom: 4px; border-bottom: 1px solid var(--line);
  }
  .group:first-child { margin-top: 0; }

  /* album rows + their expanded tracks */
  .alb-art {
    width: 34px; height: 34px; border-radius: 4px; flex-shrink: 0; object-fit: cover;
    background: linear-gradient(140deg, var(--accent-soft), var(--panel-2));
  }
  .alb-toggle {
    background: none; border: 0; color: var(--muted); font-size: 12px;
    width: 20px; flex-shrink: 0; transition: transform .15s;
  }
  .alb-toggle.open { transform: rotate(90deg); color: var(--accent); }
  .alb-tracks { display: none; padding-left: 18px; border-left: 2px solid var(--line); margin-left: 14px; }
  .alb-tracks.open { display: block; }
  .alb-tracks .row { padding: 6px 8px; }
  @media (prefers-reduced-motion: reduce) { .alb-toggle { transition: none; } }

  /* draggable queue rows */
  .row[draggable="true"] { cursor: grab; }
  .row.dragging { opacity: .4; }
  .row.dropbefore { box-shadow: inset 0 2px 0 0 var(--accent); }
  .row.dropafter  { box-shadow: inset 0 -2px 0 0 var(--accent); }
  .grip { color: var(--muted); font-size: 13px; cursor: grab; flex-shrink: 0; padding: 0 2px; }
  .queue-hint { color: var(--muted); font-size: 11px; padding: 4px 12px 0; }

  /* schedule */
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 12px; }
  .form input, .form select {
    padding: 9px 10px; border-radius: 8px; min-width: 0;
    background: var(--panel); border: 1px solid var(--line);
  }
  .form .full { grid-column: 1 / -1; }
  .days { display: flex; gap: 4px; grid-column: 1 / -1; }

  .routine { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .routine-head { display: flex; align-items: center; gap: 9px; }
  .routine-time { font-family: var(--mono); font-size: 17px; font-variant-numeric: tabular-nums; }
  .routine-name { flex: 1; min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .steps { margin: 6px 0 0 8px; }
  .step { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); padding: 2px 0; }
  .step .off {
    font-family: var(--mono); min-width: 44px; text-align: right; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .step .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .linkbtn { background: none; border: 0; color: var(--accent); font-size: 12px; padding: 4px 8px; }
  .off-routine { opacity: .45; }

  /* calendar */
  .viewtabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .viewtabs button {
    flex: 1; padding: 8px; border-radius: 8px; font-size: 12px;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink-2);
  }
  .viewtabs button.on {
    background: color-mix(in srgb, var(--accent) 18%, var(--panel));
    border-color: var(--accent-soft); color: var(--accent);
  }
  .cal { width: 100%; border-collapse: collapse; font-size: 12px; }
  .cal th {
    font-weight: 400; color: var(--muted); font-size: 10px; padding: 5px 2px;
    font-family: var(--mono); letter-spacing: .06em; border-bottom: 1px solid var(--line);
  }
  .cal th.today { color: var(--accent-2); font-weight: 600; }
  .cal td { text-align: center; padding: 8px 2px; border-bottom: 1px solid var(--line); }
  .cal td.time {
    text-align: right; padding-right: 8px; color: var(--ink-2);
    font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .cal td.miss { color: var(--faint); }
  .cal td.hit { cursor: pointer; }

  /* sheet + toast */
  .sheet {
    display: none; position: fixed; inset: auto 0 0 0; z-index: 40;
    background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0; padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    max-height: 72vh; overflow-y: auto;
  }
  .sheet.open { display: block; }
  .sheet h3 { margin: 0 0 10px; font-size: 14px; font-weight: 500; color: var(--ink-2); }
  .sheet-item { padding: 12px 8px; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }

  /* routine editor -- a sheet on a phone, a centred dialog on a desktop */
  .scrim { display: none; position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,.5); }
  .scrim.open { display: block; }
  .editor {
    display: none; position: fixed; inset: auto 0 0 0; z-index: 50;
    background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow-y: auto;
  }
  .editor.open { display: block; }
  @media (min-width: 760px) {
    .editor {
      inset: 50% auto auto 50%; transform: translate(-50%, -50%);
      width: 540px; max-width: 92vw; max-height: 86vh;
      border: 1px solid var(--line); border-radius: 14px;
    }
  }
  .ed-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .ed-head h3 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
  .ed-when { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ed-when input[type=time] {
    font-family: var(--mono); font-size: 26px; font-variant-numeric: tabular-nums;
    padding: 6px 8px; border-radius: 10px; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .ed-name {
    flex: 1; min-width: 0; padding: 10px; border-radius: 9px; font-size: 14px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
  }
  .daybtn {
    flex: 1; padding: 9px 0; font-size: 12px; border-radius: 7px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2);
  }
  .daybtn.on {
    background: color-mix(in srgb, var(--accent) 22%, var(--panel-2));
    border-color: var(--accent-soft); color: var(--accent); font-weight: 700;
  }
  .ed-presets { display: flex; gap: 4px; margin: 6px 0 0; }
  .ed-next {
    font-family: var(--mono); font-size: 11.5px; color: var(--accent);
    margin: 10px 0 2px; letter-spacing: .02em;
  }
  .ed-next.warn { color: var(--accent-2); }
  .ed-step { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .ed-row { display: flex; align-items: center; gap: 6px; }
  .ed-row + .ed-row { margin-top: 6px; padding-left: 4px; }
  .ed-step input[type=time] {
    font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px;
    padding: 7px 6px; border-radius: 7px; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .ed-step select, .ed-step input[type=number] {
    padding: 7px 6px; border-radius: 7px; min-width: 0; font-size: 13px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
  }
  .ed-step .ed-act { flex: 1; min-width: 0; }
  .ed-step .ed-src { flex: 1; min-width: 0; }
  .ed-step .ed-vol { width: 66px; flex: none; }
  .tag {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em;
    padding: 3px 6px; border-radius: 5px; white-space: nowrap;
    background: color-mix(in srgb, var(--accent-2) 24%, var(--panel-2));
    border: 1px solid var(--accent-soft); color: var(--ink-2);
  }
  .ed-foot { display: flex; gap: 8px; margin-top: 16px; }
  .ed-foot .btn { flex: 1; }
  .next-run {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    margin: 5px 0 0 8px; letter-spacing: .02em;
  }
  .next-run.warn { color: var(--accent-2); }
  /* A routine that silently did nothing is the failure this whole feature
     exists to prevent, so it gets stated on the card rather than left in the
     log. Reuses accent-2 -- the same colour the never-runs warning uses -- so
     "something here needs looking at" reads the same way in both places. */
  .step.failed .what { color: var(--accent-2); }
  .last-error {
    font-family: var(--mono); font-size: 11px; color: var(--accent-2);
    margin: 4px 0 0 8px; letter-spacing: .02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 60;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    padding: 9px 15px; border-radius: 999px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
    max-width: 88vw; text-align: center;
  }
  @media (min-width: 760px) { .toast { bottom: 24px; } }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
    .tbtn:active { transform: none; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- Player: permanent furniture. Never navigated away from. -->
  <aside class="player">
   <div class="player-main">
    <img class="art" id="art" alt=""
         src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3C/svg%3E">
    <div class="np">
      <div class="np-title" id="np-title">Loading…</div>
      <div class="np-sub" id="np-artist"></div>
      <div class="np-album" id="np-album"></div>
    </div>
    <div class="transport">
      <button class="tbtn" onclick="quickCmd('previous')" title="Previous" aria-label="Previous">⏮</button>
      <button class="tbtn primary" onclick="quickCmd('resume')" title="Play" aria-label="Play">▶</button>
      <button class="tbtn" onclick="quickCmd('pause')" title="Pause" aria-label="Pause">⏸</button>
      <button class="tbtn" onclick="quickCmd('skip')" title="Skip" aria-label="Skip">⏭</button>
    </div>
    <div class="vol">
      <button class="vbtn" onclick="nudgeVolume(-1)" title="Volume down one"
              aria-label="Volume down one">−</button>
      <input type="range" id="vol" min="0" max="100" step="1" value="20"
             oninput="previewVolume(this.value)" onchange="setVolume(this.value)"
             aria-label="Volume">
      <button class="vbtn" onclick="nudgeVolume(1)" title="Volume up one"
              aria-label="Volume up one">+</button>
      <span class="lbl num" id="vol-num">–</span>
      <button class="vbtn shuf" id="shuffle-btn" onclick="toggleShuffle()"
              title="Shuffle" aria-label="Shuffle" aria-pressed="false">🔀</button>
    </div>
    <div class="chips">
      <div class="chip" id="chip-queue">Queue —</div>
      <div class="chip" id="chip-sched">No schedules</div>
    </div>
   </div>

    <div class="seek" id="seek" data-idle="true">
      <span class="t" id="seek-now">0:00</span>
      <input type="range" id="seek-bar" min="0" max="100" value="0" step="1"
             oninput="seekBarInput(this.value)" onchange="seekBarCommit(this.value)"
             aria-label="Seek">
      <span class="t right" id="seek-end">0:00</span>
    </div>
  </aside>

  <main class="content">
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true"  onclick="setTab('search')" id="tab-search">Search</button>
      <button class="tab" role="tab" aria-selected="false" onclick="setTab('queue')"  id="tab-queue">Queue</button>
      <button class="tab" role="tab" aria-selected="false" onclick="setTab('lists')"  id="tab-lists">Playlists</button>
      <button class="tab" role="tab" aria-selected="false" onclick="setTab('sched')"  id="tab-sched">Schedule</button>
      <button class="tab" style="margin-left:auto" onclick="cycleTheme()"
              id="theme-btn" title="Theme" aria-label="Change theme">Auto</button>
    </nav>

      <div class="pane-fixed">
        <div class="searchbar">
          <input type="text" id="q" placeholder="Search for a song, artist or album…"
                 onkeydown="if(event.key==='Enter')doSearch()" aria-label="Search">
          <button class="btn primary" onclick="doSearch()">Search</button>
          <button class="btn" onclick="doAsk()" title="Ask in plain English">Ask</button>
        </div>
      </div>
      <div class="status" id="status">What do you want to hear?</div>
      <div class="pane-scroll" id="results"></div>
    </section>

    <section class="pane" id="pane-queue">
      <div class="pane-fixed">
        <div class="searchbar">
          <button class="btn" onclick="loadQueue()">Refresh</button>
          <button class="btn" onclick="clearQueue()">Clear queue</button>
          <button class="btn" onclick="scheduleNowPlaying()">⏰ Schedule this</button>
        </div>
      </div>
      <div class="queue-hint">Drag to reorder · ✕ to remove</div>
      <div class="status" id="queue-status">—</div>
      <div class="pane-scroll" id="queue-list"></div>
    </section>

    <section class="pane" id="pane-lists">
      <div class="pane-fixed">
        <div class="searchbar">
          <button class="btn" onclick="loadPlaylists()">Refresh</button>
          <button class="btn" onclick="createPlaylist()">New playlist</button>
        </div>
      </div>
      <div class="status" id="lists-status">—</div>
      <div class="pane-scroll" id="lists"></div>
    </section>

    <section class="pane" id="pane-sched">
      <div class="pane-scroll">
        <div class="viewtabs">
          <button id="view-list" class="on" onclick="setSchedView('list')">☰ Routines</button>
          <button id="view-cal" onclick="setSchedView('cal')">🗓 Week</button>
        </div>

        <div id="sched-list"></div>
        <div id="sched-cal" style="display:none"></div>

        <button class="btn primary wide" style="margin-top:14px"
                onclick="openEditor(null, null)">＋ New routine</button>

        <div class="group">📻 Stations</div>
        <div id="stn-list"></div>
        <div class="form" style="margin-top:8px">
          <input class="full" type="text" id="stn-name" placeholder="station name" aria-label="Station name">
          <input class="full" type="text" id="stn-uri" placeholder="spotify:playlist:37i9dQZF1E8…" aria-label="Station URI">
          <button class="btn full" onclick="addStation()">Save station</button>

<div class="scrim" id="scrim" onclick="closeEditor()"></div>
<div class="editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="ed-title">
  <div class="ed-head">
    <h3 id="ed-title">New routine</h3>
    <button class="abtn" title="Close" aria-label="Close" onclick="closeEditor()">✕</button>
  </div>
  <div id="ed-body"></div>
  <div class="ed-foot">
    <button class="btn" onclick="closeEditor()">Cancel</button>
    <button class="btn primary" onclick="saveEditor()">Save</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <h3 id="sheet-title">Add to playlist</h3>
  <div id="sheet-body"></div>
  <button class="btn wide" style="margin-top:10px" onclick="closeSheet()">Cancel</button>
</div>

<div class="toast" id="toast"></div>

<script>
  // Track, album, artist and playlist names come from Spotify and from the
  // Sonos queue -- anyone who can get a track into either controls this text.
  // Escape before it reaches innerHTML.
  function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const FULL_DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday',
                     'Friday', 'Saturday', 'Sunday'];
  const HHMM_RE = /^([01]\d|2[0-3]):([0-5]\d)$/;

  function toMinutes(hhmm) { return (+hhmm.slice(0, 2)) * 60 + (+hhmm.slice(3, 5)); }
  function fromMinutes(m) {
    m = ((m % 1440) + 1440) % 1440;
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' +
           String(m % 60).padStart(2, '0');
  }

  // Mirrors _next_run on the server, which stays authoritative for saved
  // routines. This copy exists only to preview a draft that has not been
  // saved yet -- the server cannot be asked about a routine it has not seen.
  function nextRunPreview(time, days) {
    if (!HHMM_RE.test(time || '')) return null;
    const now = new Date();
    const wanted = (days && days.length) ? days : [0, 1, 2, 3, 4, 5, 6];
    for (let ahead = 0; ahead < 8; ahead++) {
      const when = new Date(now.getFullYear(), now.getMonth(), now.getDate() + ahead,
                            +time.slice(0, 2), +time.slice(3, 5));
      if (!wanted.includes((when.getDay() + 6) % 7)) continue;
      if (when > now) return when;
    }
    return null;
  }

  function describeWhen(when) {
    const now = new Date();
    const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const days = Math.round((midnight(when) - midnight(now)) / 86400000);
    const clock = String(when.getHours()).padStart(2, '0') + ':' +
                  String(when.getMinutes()).padStart(2, '0');
    const label = days === 0 ? 'today'
                : days === 1 ? 'tomorrow'
                : FULL_DAYS[(when.getDay() + 6) % 7];
    return label + ' ' + clock;
  }

  function sourceName(uri) {
    const playlist = PLAYLISTS.find(p => p.uri === uri);
    if (playlist) return playlist.name;
    const station = STATIONS.find(st => st.uri === uri);
    if (station) return '📻 ' + station.name;
    return uri || '';
  }
  const ACTION_ICON = {
    play: '▶', pause: '⏸', resume: '▶', skip: '⏭',
    previous: '⏮', volume: '🔊', clearqueue: '🗑',
  };

  let toastTimer = null;
  function showToast(message) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  function postJson(path, body) {
    return fetch(path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    }).then(r => r.json().then(data => ({ok: r.ok, data})));
  }

  function post(path, body) {
    return fetch(path, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: body,
    }).then(r => r.json().then(data => ({ok: r.ok, data})));
  }

  // ---- Theme ----
  // Three states rather than two: "auto" follows the OS, which is what most
  // people want, but an explicit choice has to be able to override it in
  // both directions -- otherwise picking light on a dark-mode phone silently
  // does nothing.
  const THEMES = ['auto', 'light', 'dark'];

  function applyTheme(mode) {
    if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', mode);
    try { localStorage.setItem('dj-theme', mode); } catch (e) {}
    const btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = {auto: 'Auto', light: 'Light', dark: 'Dark'}[mode];
  }

  function currentTheme() {
    try { return localStorage.getItem('dj-theme') || 'auto'; } catch (e) { return 'auto'; }
  }

  function cycleTheme() {
    const next = THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length];
    applyTheme(next);
  }

  // ---- Tabs -------------------------------------------------------------
  const PANES = ['search', 'queue', 'lists', 'sched'];
  function setTab(which) {
    PANES.forEach(p => {
      document.getElementById('pane-' + p).dataset.active = String(p === which);
      document.getElementById('tab-' + p).setAttribute('aria-selected', String(p === which));
    });
    if (which === 'queue') loadQueue();
    if (which === 'lists' && !PLAYLISTS.length) loadPlaylists();
    if (which === 'sched') {
      loadSources().then(() => {
        renderStations();
        document.getElementById('sched-uri').innerHTML = sourceOptions('');
        loadSchedules();
      });
    }
  }

  // ---- Player -----------------------------------------------------------
  // Split from the fetch so the polled response and the pushed event paint
  // through one function. Two painters would be free to drift, and the one
  // that drifted would be whichever is harder to notice.
  function paintNowPlaying(data) {
    const playing = data.title && data.title !== 'Nothing playing';
    document.getElementById('np-title').textContent = playing ? data.title : 'Nothing playing';
    document.getElementById('np-artist').textContent = playing ? (data.artist || '') : '';
    document.getElementById('np-album').textContent = playing ? (data.album || '') : '';
    if (data.volume !== undefined && data.volume !== null && !volumeIsBusy()) {
      paintVolume(data.volume);
    }
    if (data.shuffle !== undefined && Date.now() - SHUF.touchedAt > 2500) {
      paintShuffle(data.shuffle);
    }
    // Artwork comes from Sonos in the same response. It must NOT come from
    // /album_tracks: that endpoint writes to the shared numbered-results
    // slot, so polling it for artwork silently replaced whatever the user
    // had just searched for, and "queue number 1" then queued the wrong
    // track entirely.
    if (data.artwork) document.getElementById('art').src = data.artwork;
    syncSeek(data);
  }

  function refreshNowPlaying() {
    fetch('/nowplaying').then(r => r.json()).then(paintNowPlaying).catch(() => {});
  }

  // The 10-second poll would otherwise yank the slider back to a value Sonos
  // has not caught up with yet. Time-based rather than a dragging flag so it
  // cannot get stuck: a drag that never fires change still heals in a second.
  const VOL = { touchedAt: 0 };
  function volumeIsBusy() { return Date.now() - VOL.touchedAt < 1500; }

  function paintVolume(level) {
    document.getElementById('vol').value = level;
    document.getElementById('vol-num').textContent = level;
  }

  function previewVolume(level) {
    // Fires continuously while dragging, and on every arrow key. Without it
    // the number only caught up on release, so there was no way to tell how
    // far you had moved until you let go. Deliberately local -- sending on
    // every pixel would flood Sonos.
    VOL.touchedAt = Date.now();
    document.getElementById('vol-num').textContent = level;
  }

  function setVolume(level) {
    VOL.touchedAt = Date.now();
    paintVolume(level);
    fetch('/volume?level=' + encodeURIComponent(level)).then(r => r.json()).then(data => {
      VOL.touchedAt = Date.now();
      if (data.error) { showToast('❌ ' + data.error); return; }
      if (data.level !== undefined && data.level !== null) paintVolume(data.level);
    }).catch(() => {});
  }

  function nudgeVolume(step) {
    const bar = document.getElementById('vol');
    // Move first so a tap feels instant, then correct from the reply, which
    // is authoritative when Sonos clamps or another app moved the volume.
    paintVolume(Math.min(100, Math.max(0, (+bar.value) + step)));
    VOL.touchedAt = Date.now();
    fetch('/volume?change=' + encodeURIComponent((step > 0 ? '+' : '') + step))
      .then(r => r.json()).then(data => {
        VOL.touchedAt = Date.now();
        if (data.error) { showToast('❌ ' + data.error); return; }
        if (data.level !== undefined && data.level !== null) paintVolume(data.level);
      }).catch(() => {});
  }

  // ---- Shuffle ----------------------------------------------------------
  // Sonos reports play mode about a second and a half behind the change, so
  // the button trusts the command's own reply and holds off the poll until
  // state has caught up. Without that the toggle visibly flips back.
  const SHUF = { on: false, touchedAt: 0 };

  function paintShuffle(on) {
    SHUF.on = !!on;
    const btn = document.getElementById('shuffle-btn');
    btn.classList.toggle('on', SHUF.on);
    btn.setAttribute('aria-pressed', SHUF.on ? 'true' : 'false');
    btn.title = SHUF.on ? 'Shuffle on' : 'Shuffle off';
  }

  function toggleShuffle() {
    const wanted = !SHUF.on;
    paintShuffle(wanted);
    SHUF.touchedAt = Date.now();
    fetch('/shuffle?state=' + (wanted ? 'on' : 'off')).then(r => r.json()).then(data => {
      SHUF.touchedAt = Date.now();
      if (data.error) { paintShuffle(!wanted); showToast('❌ ' + data.error); return; }
      paintShuffle(data.shuffle);
      showToast(data.shuffle ? '🔀 Shuffle on' : '➡ Shuffle off');
    }).catch(() => { paintShuffle(!wanted); });
  }

  function quickCmd(cmd) {
    fetch('/' + cmd).then(r => r.json()).then(data => {
      showToast(data.error ? '❌ ' + data.error : '✓ ' + (data.status || cmd));
      refreshNowPlaying();
    });
  }


  // ---- Seek ----
  // Position is polled every few seconds, so the bar has to advance locally
  // in between or it visibly stutters. Track when the last reading was taken
  // and extrapolate from it, re-syncing on every poll.
  const SEEK = {elapsed: 0, duration: 0, playing: false, readAt: 0, dragging: false};

  function fmtTime(seconds) {
    if (!isFinite(seconds) || seconds < 0) seconds = 0;
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function syncSeek(data) {
    SEEK.elapsed = Number(data.elapsed) || 0;
    SEEK.duration = Number(data.duration) || 0;
    SEEK.playing = data.playbackState === 'PLAYING';
    SEEK.readAt = Date.now();
    const row = document.getElementById('seek');
    row.dataset.idle = String(!SEEK.duration);
    document.getElementById('seek-bar').max = SEEK.duration || 100;
    document.getElementById('seek-end').textContent = fmtTime(SEEK.duration);
    paintSeek();
  }

  function currentElapsed() {
    if (!SEEK.playing) return SEEK.elapsed;
    return Math.min(SEEK.elapsed + (Date.now() - SEEK.readAt) / 1000, SEEK.duration);
  }

  function paintSeek() {
    // Never move the handle while it is being dragged -- the poll would yank
    // it back under the user's finger.
    if (SEEK.dragging || !SEEK.duration) return;
    const at = currentElapsed();
    document.getElementById('seek-bar').value = Math.floor(at);
    document.getElementById('seek-now').textContent = fmtTime(at);
  }

  function seekBarInput(value) {
    SEEK.dragging = true;
    document.getElementById('seek-now').textContent = fmtTime(Number(value));
  }

  function seekBarCommit(value) {
    const to = Math.floor(Number(value));
    // Assume it worked so the bar does not snap back while the request is in
    // flight; the next poll corrects it if Sonos disagreed.
    SEEK.elapsed = to;
    SEEK.readAt = Date.now();
    SEEK.dragging = false;
    fetch('/seek?to=' + to).then(r => r.json()).then(data => {
      if (data.error) showToast('❌ ' + data.error);
      refreshNowPlaying();
    });
  }

  // ---- Search -----------------------------------------------------------
  // One query, two searches. Albums appear above tracks and expand in place,
  // which is why there is no type selector: the field filters (album:,
  // artist:, year:) still work and the results stay in one list.
  function doSearch() {
    const q = document.getElementById('q').value.trim();
    if (!q) return;
    document.getElementById('status').textContent = 'Searching…';
    Promise.all([
      fetch('/search?q=' + encodeURIComponent(q) + '&type=album&limit=5').then(r => r.json()),
      fetch('/search?q=' + encodeURIComponent(q) + '&type=track&limit=12').then(r => r.json()),
    ]).then(([albums, tracks]) => {
      const err = albums.error || tracks.error;
      if (err) { document.getElementById('status').textContent = '❌ ' + err; return; }
      const a = albums.results || [], t = tracks.results || [];
      document.getElementById('status').textContent =
        a.length + ' album' + (a.length === 1 ? '' : 's') + ' · ' +
        t.length + ' track' + (t.length === 1 ? '' : 's');
      renderSearch(a, t);
    });
  }

  // Natural language goes through Claude. Kept separate from Search so the
  // app stays fully usable when Claude is unavailable.
  function doAsk() {
    const q = document.getElementById('q').value.trim();
    if (!q) return;
    document.getElementById('status').textContent = 'Thinking…';
    fetch('/chat?message=' + encodeURIComponent(q)).then(r => r.json()).then(data => {
      document.getElementById('status').textContent = data.message || 'Done';
      if (data.results) showResults(data.results);
      refreshNowPlaying();
    });
  }

  function renderSearch(albums, tracks) {
    let html = '';
    if (albums.length) {
      html += '<div class="group">Albums</div>' + albums.map(renderAlbumRow).join('');
    }
    if (tracks.length) {
      html += '<div class="group">Tracks</div>' +
        tracks.map(t => trackRow(t, false)).join('');
    }
    document.getElementById('results').innerHTML = html || '<div class="empty">No results.</div>';
  }

  function renderAlbumRow(a) {
    const key = a.uri.replace(/[^a-zA-Z0-9]/g, '');
    return '<div class="row">' +
        '<button class="alb-toggle" id="tog-' + key + '" title="Show tracks" ' +
          'onclick="toggleAlbum(\'' + escapeHtml(a.uri) + '\')">▶</button>' +
        (a.artwork
          ? '<img class="alb-art" alt="" src="' + escapeHtml(a.artwork) + '">'
          : '<span class="alb-art"></span>') +
        '<div class="row-body">' +
          '<div class="row-title">' + escapeHtml(a.name) + '</div>' +
          '<div class="row-sub">' + escapeHtml(a.artist) +
            (a.year ? ' · ' + escapeHtml(a.year) : '') +
            ' · ' + escapeHtml(String(a.tracks)) + ' tracks</div>' +
        '</div>' +
        '<div class="row-acts">' +
          '<button class="abtn go" title="Play album" onclick="playUri(\'' + escapeHtml(a.uri) + '\')">▶</button>' +
          '<button class="abtn" title="Queue album" onclick="queueUri(\'' + escapeHtml(a.uri) + '\')">＋</button>' +
          '<button class="abtn" title="Schedule" aria-label="Schedule this album" ' +
            'onclick="scheduleUri(\'' + escapeHtml(a.uri) + '\', \'' +
            encodeURIComponent(a.name).replace(/'/g, '%27') + '\')">⏰</button>' +
        '</div>' +
      '</div>' +
      '<div class="alb-tracks" id="alb-' + key + '"></div>';
  }

  function trackRow(item, nested) {
    return '<div class="row">' +
        '<div class="row-num">' + escapeHtml(String(item.num)) + '</div>' +
        '<div class="row-body">' +
          '<div class="row-title">' + escapeHtml(item.name) + '</div>' +
          '<div class="row-sub">' + escapeHtml(item.artist) +
            (!nested && item.album ? ' · ' + escapeHtml(item.album) : '') + '</div>' +
        '</div>' +
        '<div class="row-acts">' +
          '<button class="abtn go" title="Play now" onclick="trackAction(\'' + escapeHtml(item.uri) + '\', \'play\')">▶</button>' +
          '<button class="abtn" title="Play next" onclick="trackAction(\'' + escapeHtml(item.uri) + '\', \'next\')">⏭</button>' +
          '<button class="abtn" title="Add to queue" onclick="trackAction(\'' + escapeHtml(item.uri) + '\', \'queue\')">＋</button>' +
          '<button class="abtn" title="Add to playlist" onclick="openAddToPlaylist(\'' + escapeHtml(item.uri) + '\')">☰</button>' +
          '<button class="abtn" title="Schedule" aria-label="Schedule this" ' +
            'onclick="scheduleUri(\'' + escapeHtml(item.uri) + '\', \'' +
            encodeURIComponent(item.name).replace(/'/g, '%27') + '\')">⏰</button>' +
        '</div>' +
      '</div>';
  }

  // Track lists are fetched once and kept, so collapsing and reopening an
  // album does not hit Spotify again.
  const ALBUM_CACHE = {};

  function toggleAlbum(uri) {
    const key = uri.replace(/[^a-zA-Z0-9]/g, '');
    const panel = document.getElementById('alb-' + key);
    const toggle = document.getElementById('tog-' + key);
    const opening = !panel.classList.contains('open');
    panel.classList.toggle('open', opening);
    toggle.classList.toggle('open', opening);
    if (!opening || ALBUM_CACHE[uri]) return;

    panel.innerHTML = '<div class="empty">Loading…</div>';
    fetch('/album_tracks?uri=' + encodeURIComponent(uri))
      .then(r => r.json()).then(data => {
        if (data.error) { panel.innerHTML = '<div class="empty">❌ ' + escapeHtml(data.error) + '</div>'; return; }
        ALBUM_CACHE[uri] = data.tracks || [];
        panel.innerHTML = ALBUM_CACHE[uri].map(t => trackRow(t, true)).join('')
          || '<div class="empty">No tracks.</div>';
      });
  }

  function showResults(results) {   // still used by the Ask path
    document.getElementById('results').innerHTML =
      results.map(t => trackRow(t, false)).join('') || '<div class="empty">No results.</div>';
  }

  // play, next and queue all mutate the Sonos queue, so all three have to
  // refresh the queue view. That is easy to miss for "play": the underlying
  // spotify "now" action does not replace the queue, it inserts the track at
  // trackNo + 1, seeks to it and plays -- so the list changes and everything
  // after the insert shifts by one.
  //
  // Only next and queue used to refresh, and only for track rows. The + on an
  // album, playlist or station row went through queueUri, which refreshed
  // nothing: it said "Queued" and left the Queue tab showing the old list, so
  // adding something looked like it had done nothing at all.
  const ACTION_TOAST = {play: '▶️ Playing', next: '⏭️ Up next', queue: '➕ Queued'};

  function trackAction(uri, action) {
    return fetch('/' + action + '?uri=' + encodeURIComponent(uri))
      .then(r => r.json())
      .then(data => {
        if (data.error) { showToast('❌ ' + data.error); return; }
        showToast(ACTION_TOAST[action] || '✓ Done');
        refreshNowPlaying();
        loadQueue();
      })
      .catch(() => showToast('❌ Could not reach the server'));
  }

  // ---- Queue ------------------------------------------------------------
  // track_no comes from Sonos and is the only reliable source for what has
  // already played: Spotify's own history stays empty because playback
  // happens through Sonos rather than a Spotify client.
  // The window is a slice of the real queue, which can be tens of thousands
  // of tracks long. QUEUE_OFFSET is the 0-based start of what is on screen,
  // so a row's true queue position is offset + row index + 1.
  let QUEUE_OFFSET = 0;
  let QUEUE_ROWS = [];

  function loadQueue(offset) {
    if (offset !== undefined) QUEUE_OFFSET = Math.max(0, offset);
    document.getElementById('queue-status').textContent = 'Loading…';
    fetch('/queue_window?offset=' + QUEUE_OFFSET + '&limit=50')
      .then(r => r.json()).then(data => {
        if (data.error) {
          document.getElementById('queue-status').textContent = '❌ ' + data.error;
          document.getElementById('queue-list').innerHTML = '';
          return;
        }
        QUEUE_ROWS = data.queue || [];
        const pos = data.track_no || 0;
        document.getElementById('chip-queue').textContent = 'Queue · playing ' + (pos || '—');
        document.getElementById('queue-status').textContent = pos
          ? 'Playing ' + pos + ' · showing ' + (QUEUE_OFFSET + 1) + '–' + (QUEUE_OFFSET + QUEUE_ROWS.length)
          : QUEUE_ROWS.length + ' tracks from ' + (QUEUE_OFFSET + 1);
        renderQueue(pos);
      });
  }

  function renderQueue(pos) {
    if (!QUEUE_ROWS.length) {
      document.getElementById('queue-list').innerHTML = '<div class="empty">Nothing here.</div>';
      return;
    }
    const rows = QUEUE_ROWS.map((t, i) => {
      const n = QUEUE_OFFSET + i + 1;
      const cls = n < pos ? 'row played' : (n === pos ? 'row current' : 'row');
      return '<div class="' + cls + '" draggable="true" data-pos="' + n + '" ' +
             'data-title="' + escapeHtml(t.title) + '">' +
        '<span class="grip">⠿</span>' +
        '<div class="row-num">' + (n === pos ? '▶' : n) + '</div>' +
        '<div class="row-body">' +
          '<div class="row-title">' + escapeHtml(t.title) + '</div>' +
          '<div class="row-sub">' + escapeHtml(t.artist) + '</div>' +
        '</div>' +
        '<div class="row-acts">' +
          '<button class="abtn" title="Remove from queue" ' +
            'onclick="removeFromQueue(' + n + ', this)">✕</button>' +
        '</div>' +
      '</div>';
    }).join('');

    const nav =
      (QUEUE_OFFSET > 0
        ? '<button class="btn wide" onclick="loadQueue(' + Math.max(0, QUEUE_OFFSET - 50) + ')">↑ earlier</button>'
        : '') +
      (QUEUE_ROWS.length === 50
        ? '<button class="btn wide" style="margin-top:6px" onclick="loadQueue(' + (QUEUE_OFFSET + 50) + ')">↓ later</button>'
        : '');

    document.getElementById('queue-list').innerHTML = rows + nav;
    wireDragAndDrop();
  }

  // Reorder by drag. Every move sends the title the row showed, and the
  // server refuses with 409 if the queue moved underneath -- tracks finish
  // and other clients edit, so an index alone is not a safe address.
  let dragFrom = null;

  function wireDragAndDrop() {
    const list = document.getElementById('queue-list');
    list.querySelectorAll('.row[draggable="true"]').forEach(row => {
      row.addEventListener('dragstart', e => {
        dragFrom = row;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', row.dataset.pos);
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        clearDropMarks();
        dragFrom = null;
      });
      row.addEventListener('dragover', e => {
        if (!dragFrom || row === dragFrom) return;
        e.preventDefault();
        clearDropMarks();
        const box = row.getBoundingClientRect();
        const after = (e.clientY - box.top) > box.height / 2;
        row.classList.add(after ? 'dropafter' : 'dropbefore');
      });
      row.addEventListener('drop', e => {
        e.preventDefault();
        if (!dragFrom || row === dragFrom) return;
        const from = parseInt(dragFrom.dataset.pos, 10);
        const over = parseInt(row.dataset.pos, 10);
        const box = row.getBoundingClientRect();
        const after = (e.clientY - box.top) > box.height / 2;
        let to = after ? over : over;
        if (after && over < from) to = over + 1;
        if (!after && over > from) to = over - 1;
        clearDropMarks();
        moveInQueue(from, to, dragFrom.dataset.title);
      });
    });
  }

  function clearDropMarks() {
    document.querySelectorAll('.dropbefore, .dropafter')
      .forEach(el => el.classList.remove('dropbefore', 'dropafter'));
  }

  function moveInQueue(from, to, title) {
    if (from === to) return;
    post('/queue_move', new URLSearchParams({index: from, to: to, title: title}).toString())
      .then(({ok, data}) => {
        showToast(ok ? '↕ Moved to ' + to : '❌ ' + (data.error || 'Move failed'));
        loadQueue();
      });
  }

  function removeFromQueue(pos, button) {
    const row = button.closest('.row');
    post('/queue_remove',
      new URLSearchParams({index: pos, title: row.dataset.title}).toString())
      .then(({ok, data}) => {
        showToast(ok ? '✕ Removed' : '❌ ' + (data.error || 'Remove failed'));
        loadQueue();
      });
  }

  function showQueue(queue) {   // kept for callers that pass a queue directly
    document.getElementById('queue-list').innerHTML = (queue || []).map((t, i) =>
      '<div class="row">' +
        '<div class="row-num">' + (i + 1) + '</div>' +
        '<div class="row-body">' +
          '<div class="row-title">' + escapeHtml(t.title) + '</div>' +
          '<div class="row-sub">' + escapeHtml(t.artist) + '</div>' +
        '</div>' +
      '</div>'
    ).join('');
  }

  function clearQueue() {
    if (!confirm('Clear the whole Sonos queue?')) return;
    fetch('/clearqueue').then(r => r.json()).then(data => {
      showToast(data.error ? '❌ ' + data.error : '🗑 Queue cleared');
      loadQueue();
    });
  }

  // ---- Playlists & stations ---------------------------------------------
  let PLAYLISTS = [];
  let SCHEDULES = [];
  let STATIONS = [];

  function loadSources() {
    return Promise.all([
      fetch('/my?action=playlists&limit=50').then(r => r.json()).catch(() => ({})),
      fetch('/stations').then(r => r.json()).catch(() => ({})),
    ]).then(([pl, st]) => {
      PLAYLISTS = pl.your_playlists || [];
      STATIONS = st.stations || [];
    });
  }

  function sourceOptions(selected) {
    const opt = (uri, label) =>
      '<option value="' + escapeHtml(uri) + '"' +
      (uri === selected ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
    let html = '<option value="">— choose a playlist —</option>';
    if (PLAYLISTS.length) {
      html += '<optgroup label="my playlists">' +
        PLAYLISTS.map(p => opt(p.uri, p.name)).join('') + '</optgroup>';
    }
    if (STATIONS.length) {
      html += '<optgroup label="stations">' +
        STATIONS.map(s => opt(s.uri, '📻 ' + s.name)).join('') + '</optgroup>';
    }
    html += '<option value="__paste__">✎ paste a URI…</option>';
    return html;
  }

  function loadPlaylists() {
    document.getElementById('lists-status').textContent = 'Loading…';
    loadSources().then(() => {
      document.getElementById('lists-status').textContent =
        PLAYLISTS.length + ' playlists · ' + STATIONS.length + ' stations';
      showPlaylists(PLAYLISTS);
    });
  }

  function showPlaylists(playlists) {
    document.getElementById('lists').innerHTML = playlists.map(item =>
      '<div class="row">' +
        '<div class="row-num">' + escapeHtml(String(item.num)) + '</div>' +
        '<div class="row-body">' +
          '<div class="row-title">' + escapeHtml(item.name) + '</div>' +
          '<div class="row-sub">' + escapeHtml(String(item.tracks)) + ' tracks</div>' +
        '</div>' +
        '<div class="row-acts">' +
          '<button class="abtn go" title="Play now" onclick="playUri(\'' + escapeHtml(item.uri) + '\')">▶</button>' +
          '<button class="abtn" title="Add to queue" onclick="queueUri(\'' + escapeHtml(item.uri) + '\')">＋</button>' +
        '</div>' +
      '</div>'
    ).join('') || '<div class="empty">No playlists found.</div>';
  }

  function playPlaylist(num) {
    const item = PLAYLISTS.find(p => p.num === num);
    if (item) playUri(item.uri);
  }

  function playUri(uri) { return trackAction(uri, 'play'); }

  function queueUri(uri) { return trackAction(uri, 'queue'); }

  function renderStations() {
    const el = document.getElementById('stn-list');
    if (!STATIONS.length) {
      el.innerHTML = '<div class="empty">No stations yet. In Spotify: right-click a song → ' +
        'Go to Song Radio → Share → Copy link, then paste it below.</div>';
      return;
    }
    el.innerHTML = STATIONS.map(s =>
      '<div class="row">' +
        '<div class="row-body"><div class="row-title">📻 ' + escapeHtml(s.name) + '</div></div>' +
        '<div class="row-acts">' +
          '<button class="abtn go" title="Play now" onclick="playUri(\'' + escapeHtml(s.uri) + '\')">▶</button>' +
          '<button class="abtn" title="Add to queue" onclick="queueUri(\'' + escapeHtml(s.uri) + '\')">＋</button>' +
          '<button class="abtn" title="Schedule" aria-label="Schedule this station" ' +
            'onclick="scheduleUri(\'' + escapeHtml(s.uri) + '\', \'' +
            encodeURIComponent(s.name).replace(/'/g, '%27') + '\')">⏰</button>' +
          '<button class="abtn" title="Delete" onclick="deleteStation(\'' + s.id + '\')">🗑</button>' +
        '</div>' +
      '</div>'
    ).join('');
  }

  function addStation() {
    const name = document.getElementById('stn-name').value.trim();
    const uri = document.getElementById('stn-uri').value.trim();
    post('/station_add', new URLSearchParams({name, uri}).toString()).then(({ok, data}) => {
      if (!ok) { showToast('❌ ' + (data.error || 'Could not save')); return; }
      document.getElementById('stn-name').value = '';
      document.getElementById('stn-uri').value = '';
      showToast('📻 Station saved');
      loadSources().then(renderStations);
    });
  }

  function deleteStation(id) {
    post('/station_delete', 'id=' + encodeURIComponent(id))
      .then(() => loadSources().then(renderStations));
  }

  // ---- Add to playlist --------------------------------------------------
  let sheetTrackUri = null;

  function openAddToPlaylist(uri) {
    sheetTrackUri = uri;
    document.getElementById('sheet-title').textContent = 'Add to playlist';
    const body = PLAYLISTS.length
      ? PLAYLISTS.map(p =>
          '<div class="sheet-item" onclick="addToPlaylist(\'' + escapeHtml(p.uri) + '\')">' +
          escapeHtml(p.name) + '</div>').join('')
      : '<div class="empty">No playlists loaded yet — open the Playlists tab.</div>';
    document.getElementById('sheet-body').innerHTML = body +
      '<div class="sheet-item" onclick="createPlaylistThenAdd()">＋ New playlist…</div>';
    document.getElementById('sheet').classList.add('open');
  }

  function closeSheet() {
    document.getElementById('sheet').classList.remove('open');
  }

  function addToPlaylist(playlistUri) {
    const id = playlistUri.split(':').pop();
    post('/add_to_playlist',
      new URLSearchParams({playlist_id: id, uri: sheetTrackUri}).toString())
      .then(({ok, data}) => {
        closeSheet();
        showToast(ok ? '✅ Added' : '❌ ' + (data.error || 'Failed'));
      });
  }

  function createPlaylist() {
    const name = prompt('New playlist name');
    if (!name) return;
    post('/create_playlist', new URLSearchParams({name}).toString()).then(({ok, data}) => {
      showToast(ok ? '✅ Created' : '❌ ' + (data.error || 'Failed'));
      if (ok) loadPlaylists();
    });
  }

  function createPlaylistThenAdd() {
    const name = prompt('New playlist name');
    if (!name) return;
    post('/create_playlist', new URLSearchParams({name}).toString()).then(({ok, data}) => {
      if (!ok) { showToast('❌ ' + (data.error || 'Failed')); return; }
      loadSources().then(() => addToPlaylist(data.uri));
    });
  }

  // ---- Schedules --------------------------------------------------------



  // Grouped by the days they run, because that is how they are thought about:
  // "my weekday mornings", not "the 07:00 one".
  function groupName(days) {
    const key = (days || []).join(',');
    if (key === '' || key === '0,1,2,3,4,5,6') return 'EVERY DAY';
    if (key === '0,1,2,3,4') return 'WEEKDAYS';
    if (key === '5,6') return 'WEEKENDS';
    return days.map(d => DAY_NAMES[d]).join(' ').toUpperCase();
  }

  function describeStep(step) {
    if (step.action === 'play') {
      let what = 'play ' + sourceName(step.uri);
      if (step.volume !== undefined && step.volume !== null) what += ' · vol ' + step.volume;
      return what;
    }
    if (step.action === 'volume') return 'volume ' + step.volume;
    return step.action;
  }

  function renderRoutine(s) {
    const steps = (s.steps || []).map(step =>
      '<div class="step' + (step.last_error ? ' failed' : '') + '">' +
        '<span class="off">' + escapeHtml(step.at || s.time) + '</span>' +
        '<span>' + escapeHtml(step.last_error ? '⚠' : (ACTION_ICON[step.action] || '•')) + '</span>' +
        '<span class="what">' + escapeHtml(describeStep(step)) +
          (step.next_day ? ' · next day' : '') + '</span>' +
      '</div>'
    ).join('') || '<div class="step"><span class="what">no steps</span></div>';

    // The server records last_error per step; without this the only trace of
    // a wake-up that did nothing was a line in a rotating log nobody reads.
    const failed = (s.steps || []).filter(step => step.last_error);
    const failure = failed.length ? describeFailure(failed) : '';

    // The absence of this line is how a wake-up alarm sat on Sunday-only
    // without anyone noticing.
    const when = s.next_run
      ? 'next: ' + describeWhen(new Date(s.next_run))
      : (s.enabled ? 'never runs — no days selected' : 'disabled');

    return '<div class="routine' + (s.enabled ? '' : ' off-routine') + '">' +
      '<div class="routine-head">' +
        '<div class="routine-time">' + escapeHtml(s.time) + '</div>' +
        '<div class="routine-name">' + escapeHtml(s.label || '(unnamed)') + '</div>' +
        '<button class="abtn" title="Edit" aria-label="Edit routine" ' +
          'onclick="editRoutine(\'' + s.id + '\')">✎</button>' +
        '<button class="abtn" title="Enable/disable" onclick="toggleSchedule(\'' + s.id + '\')">' +
          (s.enabled ? '🔔' : '🔕') + '</button>' +
        '<button class="abtn" title="Run now" onclick="runSchedule(\'' + s.id + '\')">⚡</button>' +
        '<button class="abtn" title="Delete" onclick="deleteSchedule(\'' + s.id + '\')">🗑</button>' +
      '</div>' +
      '<div class="steps">' + steps + '</div>' +
      (failure ? '<div class="last-error">' + escapeHtml(failure) + '</div>' : '') +
      '<div class="next-run' + (s.next_run || !s.enabled ? '' : ' warn') + '">' +
        escapeHtml(when) + '</div>' +
    '</div>';
  }

  // Says which day it failed, because "it failed" about a routine that runs
  // every morning is not enough to know whether to care.
  function describeFailure(failed) {
    const worst = failed.find(step => step.last_error.final) || failed[0];
    const err = worst.last_error;
    const when = err.date ? describeDay(err.date) : 'recently';
    const detail = err.final
      ? 'gave up after ' + err.attempts + (err.attempts === 1 ? ' try' : ' tries')
      : 'failed';
    return '⚠ ' + when + ': ' + detail + ' — ' + (err.message || 'unknown error');
  }

  function describeDay(iso) {
    const today = new Date();
    const pad = n => String(n).padStart(2, '0');
    const asLocal = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    if (iso === asLocal(today)) return 'today';
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    if (iso === asLocal(yesterday)) return 'yesterday';
    return iso;
  }

  // ---- Routine editor ---------------------------------------------------
  //
  // One composer for both creating and editing. The old flow had two: a form
  // that made a routine plus a hidden first step, and a second form inside
  // each card for every step after that -- so the same idea had to be learnt
  // twice, and step one was never visible as a step at all. Steps here carry
  // the wall-clock time they fire at rather than an offset in minutes,
  // because "+75m" makes the reader do arithmetic to answer the only
  // question they actually have.

  let EDITOR = null;

  function openEditor(routine, prefill) {
    if (routine) {
      EDITOR = {
        id: routine.id,
        label: routine.label || '',
        time: routine.time,
        days: (routine.days || []).slice(),
        enabled: routine.enabled !== false,
        steps: (routine.steps || []).map(step => ({
          at: step.at || routine.time,
          action: step.action,
          uri: step.uri || '',
          name: step.uri ? sourceName(step.uri) : '',
          volume: (step.volume === undefined || step.volume === null)
            ? '' : String(step.volume),
        })),
      };
    } else {
      EDITOR = {
        id: null, label: '', time: '07:00',
        days: [0, 1, 2, 3, 4], enabled: true, steps: [],
      };
      if (prefill) {
        EDITOR.label = prefill.name || '';
        EDITOR.steps.push({
          at: EDITOR.time, action: 'play',
          uri: prefill.uri, name: prefill.name || prefill.uri, volume: '',
        });
      }
    }
    document.getElementById('scrim').classList.add('open');
    document.getElementById('editor').classList.add('open');
    renderEditor();
    // Playlists and stations fill the source dropdowns. The editor is usable
    // before they land, so refresh rather than block -- but only when they
    // are actually missing, since re-rendering costs the user their cursor.
    if (!PLAYLISTS.length && !STATIONS.length) loadSources().then(renderEditor);
  }

  function editRoutine(id) {
    const routine = SCHEDULES.find(s => s.id === id);
    if (!routine) { showToast('❌ That routine is gone'); loadSchedules(); return; }
    openEditor(routine, null);
  }

  function scheduleUri(uri, encodedName) {
    openEditor(null, {uri: uri, name: decodeURIComponent(encodedName)});
  }

  function scheduleNowPlaying() {
    fetch('/nowplaying').then(r => r.json()).then(data => {
      if (!data || !data.uri) { showToast('❌ Nothing is playing'); return; }
      scheduleUri(data.uri, data.title || data.name || '');
    });
  }

  function closeEditor() {
    EDITOR = null;
    document.getElementById('scrim').classList.remove('open');
    document.getElementById('editor').classList.remove('open');
  }

  function editorTimeChanged(value) {
    if (!HHMM_RE.test(value)) return;
    // Moving a wake-up from 06:00 to 06:30 should move the whole routine, so
    // steps keep their spacing and every displayed time visibly shifts.
    const delta = toMinutes(value) - toMinutes(EDITOR.time);
    EDITOR.time = value;
    EDITOR.steps.forEach(step => { step.at = fromMinutes(toMinutes(step.at) + delta); });
    renderEditor();
  }

  function editorToggleDay(day) {
    const at = EDITOR.days.indexOf(day);
    if (at === -1) EDITOR.days.push(day); else EDITOR.days.splice(at, 1);
    EDITOR.days.sort((a, b) => a - b);
    renderEditor();
  }

  function editorPreset(which) {
    EDITOR.days = which === 'weekdays' ? [0, 1, 2, 3, 4]
                : which === 'weekend' ? [5, 6]
                : [0, 1, 2, 3, 4, 5, 6];
    renderEditor();
  }

  function editorAddStep() {
    const last = EDITOR.steps[EDITOR.steps.length - 1];
    EDITOR.steps.push({
      at: last ? last.at : EDITOR.time,
      action: 'play', uri: '', name: '', volume: '',
    });
    renderEditor();
  }

  function editorRemoveStep(index) {
    EDITOR.steps.splice(index, 1);
    renderEditor();
  }

  function editorStepField(index, field, value) {
    EDITOR.steps[index][field] = value;
    renderEditor();
  }

  function editorSource(index, select) {
    if (select.value === '__paste__') {
      const pasted = prompt('Paste a Spotify URI (playlist, album or Song Radio)');
      if (pasted) {
        EDITOR.steps[index].uri = pasted.trim();
        EDITOR.steps[index].name = pasted.trim();
      }
    } else {
      EDITOR.steps[index].uri = select.value;
      EDITOR.steps[index].name = select.options[select.selectedIndex].text;
    }
    renderEditor();
  }

  function editorStepOptions(step) {
    const known = PLAYLISTS.some(p => p.uri === step.uri) ||
                  STATIONS.some(st => st.uri === step.uri);
    let html = sourceOptions(step.uri);
    if (step.uri && !known) {
      // A URI arrived from search or a paste, so it is in neither list; keep
      // it selected rather than silently resetting the step to "choose one".
      html = '<option value="' + escapeHtml(step.uri) + '" selected>' +
             escapeHtml(step.name || step.uri) + '</option>' + html;
    }
    return html;
  }

  function editorStepRow(step, index) {
    const wraps = toMinutes(step.at) < toMinutes(EDITOR.time);
    const wantsUri = step.action === 'play';
    const wantsVolume = step.action === 'play' || step.action === 'volume';

    let detail = '';
    if (wantsUri) {
      detail += '<select class="ed-src" aria-label="What to play" ' +
        'onchange="editorSource(' + index + ', this)">' +
        editorStepOptions(step) + '</select>';
    }
    if (wantsVolume) {
      detail += '<input class="ed-vol" type="number" min="0" max="100" placeholder="vol" ' +
        'aria-label="Volume" value="' + escapeHtml(step.volume) + '" ' +
        'oninput="EDITOR.steps[' + index + '].volume = this.value">';
    }

    return '<div class="ed-step">' +
        '<div class="ed-row">' +
          '<input type="time" aria-label="Step time" value="' + escapeHtml(step.at) + '" ' +
            'onchange="editorStepField(' + index + ', \'at\', this.value)">' +
          (wraps ? '<span class="tag">next day</span>' : '') +
          '<select class="ed-act" aria-label="Action" ' +
            'onchange="editorStepField(' + index + ', \'action\', this.value)">' +
            Object.keys(ACTION_ICON).map(action =>
              '<option value="' + action + '"' +
              (action === step.action ? ' selected' : '') + '>' +
              ACTION_ICON[action] + ' ' + action + '</option>').join('') +
          '</select>' +
          '<button class="abtn" title="Remove step" aria-label="Remove step" ' +
            'onclick="editorRemoveStep(' + index + ')">✕</button>' +
        '</div>' +
        (detail ? '<div class="ed-row">' + detail + '</div>' : '') +
      '</div>';
  }

  function renderEditor() {
    if (!EDITOR) return;
    document.getElementById('ed-title').textContent =
      EDITOR.id ? 'Edit routine' : 'New routine';

    const upcoming = nextRunPreview(EDITOR.time, EDITOR.days);
    const preview = upcoming
      ? 'Next run: ' + describeWhen(upcoming)
      : 'Never runs — pick at least one day';

    document.getElementById('ed-body').innerHTML =
      '<div class="ed-when">' +
        '<input type="time" aria-label="Start time" value="' + escapeHtml(EDITOR.time) + '" ' +
          'onchange="editorTimeChanged(this.value)">' +
        '<input class="ed-name" aria-label="Routine name" placeholder="name this routine" ' +
          'value="' + escapeHtml(EDITOR.label) + '" oninput="EDITOR.label = this.value">' +
      '</div>' +
      '<div class="days">' +
        DAY_NAMES.map((day, i) =>
          '<button type="button" class="daybtn' +
            (EDITOR.days.includes(i) ? ' on' : '') + '" ' +
            'aria-pressed="' + EDITOR.days.includes(i) + '" ' +
            'onclick="editorToggleDay(' + i + ')">' + day + '</button>').join('') +
      '</div>' +
      '<div class="ed-presets">' +
        '<button class="linkbtn" onclick="editorPreset(\'weekdays\')">weekdays</button>' +
        '<button class="linkbtn" onclick="editorPreset(\'weekend\')">weekend</button>' +
        '<button class="linkbtn" onclick="editorPreset(\'every\')">every day</button>' +
      '</div>' +
      '<div class="ed-next' + (upcoming ? '' : ' warn') + '">' + escapeHtml(preview) + '</div>' +
      '<div class="group">Steps</div>' +
      (EDITOR.steps.length
        ? EDITOR.steps.map(editorStepRow).join('')
        : '<div class="empty">No steps yet — this routine would do nothing.</div>') +
      '<button class="btn wide" style="margin-top:10px" onclick="editorAddStep()">' +
        '＋ Add step</button>';
  }

  function saveEditor() {
    const trigger = toMinutes(EDITOR.time);
    const payload = {
      time: EDITOR.time,
      days: EDITOR.days,
      label: EDITOR.label,
      enabled: EDITOR.enabled,
      steps: EDITOR.steps.map(step => {
        const out = {
          offset: ((toMinutes(step.at) - trigger) % 1440 + 1440) % 1440,
          action: step.action,
        };
        if (step.uri) out.uri = step.uri;
        if (step.volume !== '') out.volume = Number(step.volume);
        return out;
      }),
    };
    if (EDITOR.id) payload.id = EDITOR.id;

    postJson('/schedule_save', payload).then(({ok, data}) => {
      if (!ok) { showToast('❌ ' + (data.error || 'Could not save')); return; }
      showToast(data.status === 'updated' ? '⏰ Routine updated' : '⏰ Routine created');
      closeEditor();
      loadSchedules();
    });
  }

  function loadSchedules() {
    fetch('/schedules').then(r => r.json()).then(data => {
      const list = data.schedules || [];
      SCHEDULES = list;
      const enabled = list.filter(s => s.enabled).length;
      document.getElementById('chip-sched').textContent =
        list.length ? (enabled + ' of ' + list.length + ' routines on') : 'No schedules';
      if (!list.length) {
        document.getElementById('sched-list').innerHTML =
          '<div class="empty">Nothing scheduled yet.</div>';
        return;
      }
      const groups = {};
      list.forEach(s => { const g = groupName(s.days); (groups[g] = groups[g] || []).push(s); });
      const order = ['WEEKDAYS', 'WEEKENDS', 'EVERY DAY'];
      const names = Object.keys(groups).sort((a, b) => {
        const ia = order.indexOf(a), ib = order.indexOf(b);
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      });
      document.getElementById('sched-list').innerHTML = names.map(g =>
        '<div class="group">' + escapeHtml(g) + '</div>' +
        groups[g].sort((a, b) => a.time.localeCompare(b.time)).map(renderRoutine).join('')
      ).join('');
    });
  }





  function deleteSchedule(id) {
    post('/schedule_delete', 'id=' + encodeURIComponent(id))
      .then(() => { showToast('🗑 Deleted'); loadSchedules(); });
  }

  function toggleSchedule(id) {
    post('/schedule_toggle', 'id=' + encodeURIComponent(id)).then(() => loadSchedules());
  }

  function runSchedule(id) {
    post('/schedule_run', 'id=' + encodeURIComponent(id))
      .then(({ok, data}) => showToast(ok ? '⚡ Ran it' : '❌ ' + (data.error || 'Failed')));
  }

  // ---- Weekly calendar --------------------------------------------------
  function setSchedView(which) {
    const isCal = which === 'cal';
    document.getElementById('sched-list').style.display = isCal ? 'none' : '';
    document.getElementById('sched-cal').style.display = isCal ? '' : 'none';
    document.getElementById('view-cal').classList.toggle('on', isCal);
    document.getElementById('view-list').classList.toggle('on', !isCal);
    if (isCal) renderCalendar();
  }

  function renderCalendar() {
    fetch('/schedules').then(r => r.json()).then(data => {
      const list = (data.schedules || []).filter(s => s.enabled);
      const el = document.getElementById('sched-cal');
      if (!list.length) { el.innerHTML = '<div class="empty">Nothing enabled to show.</div>'; return; }
      const times = [...new Set(list.map(s => s.time))].sort();
      // JS getDay() is Sunday-based; the scheduler is Monday-based.
      const todayIdx = (new Date().getDay() + 6) % 7;

      let html = '<table class="cal"><tr><th></th>' +
        DAY_NAMES.map((d, i) =>
          '<th class="' + (i === todayIdx ? 'today' : '') + '">' + d + '</th>').join('') + '</tr>';

      times.forEach(t => {
        html += '<tr><td class="time">' + escapeHtml(t) + '</td>';
        for (let d = 0; d < 7; d++) {
          const here = list.filter(s =>
            s.time === t && ((s.days || []).length === 0 || s.days.includes(d)));
          if (!here.length) {
            html += '<td class="miss">·</td>';
          } else {
            const icons = here.map(s =>
              (s.steps || []).map(st => ACTION_ICON[st.action] || '•').join('')).join(' ');
            const names = here.map(s => s.label || '(unnamed)').join(', ');
            html += '<td class="hit" onclick="showToast(\'' +
              escapeHtml(t + ' · ' + names) + '\')">' + escapeHtml(icons) + '</td>';
          }
        }
        html += '</tr>';
      });
      el.innerHTML = html + '</table>';
    });
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && EDITOR) closeEditor();
  });

  // ---- Live updates -----------------------------------------------------
  // The player used to poll /nowplaying every 10s per open tab, which was
  // about 90% of all traffic and still left the UI up to 10s stale. The server
  // now pushes when Sonos actually changes something. The poll stays as a
  // fallback -- an EventSource can fail for reasons the page cannot fix (the
  // stream client cap, a tunnel that drops long-lived connections), and a
  // silent player is worse than a chatty one.
  let SLOW_POLL = null;

  function startFallbackPolling() {
    if (SLOW_POLL) return;
    SLOW_POLL = setInterval(refreshNowPlaying, 10000);
  }

  function stopFallbackPolling() {
    if (!SLOW_POLL) return;
    clearInterval(SLOW_POLL);
    SLOW_POLL = null;
  }

  function connectStream() {
    if (!window.EventSource) { startFallbackPolling(); return; }

    const source = new EventSource('/stream');

    source.onmessage = event => {
      // A pushed payload is the same shape /nowplaying returns, so it goes
      // through exactly the same painting path rather than a second one.
      try { paintNowPlaying(JSON.parse(event.data)); }
      catch (err) { console.error('bad stream payload', err); }
    };

    source.onopen = () => stopFallbackPolling();

    source.onerror = () => {
      // EventSource reconnects on its own, but only while the server is
      // reachable and under the client cap. Poll until a message proves the
      // stream is really back.
      startFallbackPolling();
    };
  }

  // ---- Boot -------------------------------------------------------------
  applyTheme(currentTheme());
  refreshNowPlaying();
  loadQueue();
  loadSchedules();
  connectStream();
  startFallbackPolling();   // dropped as soon as the stream opens
  setInterval(paintSeek, 1000);
</script>
</body>
</html>
