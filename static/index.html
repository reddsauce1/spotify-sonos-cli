<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DJ Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
        }
        h1 { text-align: center; font-size: 1.8em; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 14px; }
        .input-container { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
        }
        input[type="text"]::placeholder { color: #888; }
        button {
            padding: 15px 20px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: #1db954;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #1ed760; }
        button:disabled { background: #555; cursor: not-allowed; }
        .status {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            min-height: 50px;
            line-height: 1.5;
        }
        .results {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        .result-item {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .result-item:last-child { border-bottom: none; }
        .result-num { 
            background: rgba(255,255,255,0.2); 
            border-radius: 50%; 
            width: 28px; 
            height: 28px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .result-info { flex: 1; min-width: 0; }
        .song-name { font-weight: bold; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { color: #888; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .result-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .action-btn {
            padding: 8px 12px;
            font-size: 11px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }
        .action-btn:hover { transform: scale(1.05); }
        .action-btn:active { transform: scale(0.95); }
        .btn-play {
            background: #1db954;
            color: white;
        }
        .btn-next {
            background: #f59e0b;
            color: white;
        }
        .btn-queue {
            background: #6366f1;
            color: white;
        }
        .quick-buttons { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
            margin-bottom: 15px; 
        }
        .quick-btn {
            padding: 12px 8px;
            font-size: 12px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .quick-btn:hover { background: rgba(255,255,255,0.2); }
        .quick-btn .icon { font-size: 18px; }
        .nowplaying {
            background: rgba(29, 185, 84, 0.2);
            border: 1px solid rgba(29, 185, 84, 0.3);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .nowplaying .label { color: #1db954; font-size: 11px; text-transform: uppercase; margin-bottom: 5px; }
        .loading { opacity: 0.6; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }

        /* ---- Schedules ---- */
        .sched-toggle {
            width: 100%; margin-top: 14px; padding: 12px;
            background: rgba(255,255,255,0.06); color: #eee;
            border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
            font-size: 15px; cursor: pointer;
        }
        .sched-panel { display: none; margin-top: 10px; }
        .sched-panel.open { display: block; }
        .sched-form {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 8px; margin-bottom: 12px;
        }
        .sched-form input, .sched-form select {
            padding: 10px; border-radius: 8px; font-size: 15px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.25); color: #eee;
        }
        .sched-form .full { grid-column: 1 / -1; }
        .sched-days { display: flex; gap: 4px; grid-column: 1 / -1; }
        .sched-days label {
            flex: 1; text-align: center; padding: 8px 0; font-size: 13px;
            border-radius: 8px; background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.12); cursor: pointer;
        }
        .sched-days input { display: none; }
        .sched-days input:checked + span { color: #1db954; font-weight: bold; }
        .sched-item {
            display: flex; align-items: center; gap: 10px; padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .sched-when { font-size: 20px; font-variant-numeric: tabular-nums; min-width: 68px; }
        .sched-meta { flex: 1; font-size: 13px; color: #999; }
        .sched-off { opacity: 0.45; }
        .sched-item button {
            background: none; border: none; font-size: 17px; cursor: pointer; padding: 4px;
        }

        .sched-group {
            font-size: 11px; letter-spacing: 1.5px; color: #777;
            margin: 18px 0 6px; padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .sched-routine {
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .sched-head { display: flex; align-items: center; gap: 10px; }
        .sched-title { flex: 1; }
        .sched-title .name { font-size: 15px; }
        .sched-steps { margin: 6px 0 0 10px; }
        .sched-step {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #aaa; padding: 3px 0;
        }
        .sched-step .off {
            min-width: 46px; text-align: right; color: #666;
            font-variant-numeric: tabular-nums;
        }
        .sched-step .what { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sched-addstep { display: none; margin: 8px 0 4px 10px; }
        .sched-addstep.open { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .sched-addstep input, .sched-addstep select {
            padding: 8px; border-radius: 6px; font-size: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.25); color: #eee;
        }
        .sched-addstep .full { grid-column: 1 / -1; }
        .link-btn {
            background: none; border: none; color: #1db954;
            font-size: 13px; cursor: pointer; padding: 4px 10px;
        }

        /* ---- Calendar ---- */
        .cal-toggle-row { display: flex; gap: 6px; margin: 10px 0; }
        .cal-toggle-row button {
            flex: 1; padding: 8px; font-size: 13px; border-radius: 8px; cursor: pointer;
            background: rgba(255,255,255,0.05); color: #bbb;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .cal-toggle-row button.on { background: rgba(29,185,84,0.18); color: #1db954; }
        .cal { width: 100%; border-collapse: collapse; font-size: 12px; }
        .cal th {
            font-weight: normal; color: #777; padding: 6px 2px; font-size: 11px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .cal th.today { color: #1db954; }
        .cal td {
            text-align: center; padding: 7px 2px; vertical-align: top;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .cal td.time {
            text-align: right; padding-right: 8px; color: #999;
            font-variant-numeric: tabular-nums; white-space: nowrap;
        }
        .cal .hit { cursor: pointer; }
        .cal .miss { color: #333; }
        .cal-empty { color: #777; padding: 14px; font-size: 13px; }

        /* ---- Stations ---- */
        .stn-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 2px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .stn-name { flex: 1; font-size: 14px; }
        .stn-item button { background: none; border: none; font-size: 16px; cursor: pointer; }

        /* ---- Add-to-playlist sheet ---- */
        .sheet {
            display: none; position: fixed; left: 0; right: 0; bottom: 0;
            background: #16213e; border-top: 1px solid rgba(255,255,255,0.15);
            border-radius: 14px 14px 0 0; padding: 16px; z-index: 50;
            max-height: 70vh; overflow-y: auto;
        }
        .sheet.open { display: block; }
        .sheet h3 { margin: 0 0 10px; font-size: 15px; font-weight: normal; color: #ccc; }
        .sheet-item {
            padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.07);
            cursor: pointer; font-size: 15px;
        }
        .sheet-close { width: 100%; margin-top: 10px; padding: 10px; border-radius: 8px;
            background: rgba(255,255,255,0.06); color: #bbb;
            border: 1px solid rgba(255,255,255,0.12); cursor: pointer; }
    </style>
</head>
<body>
    <h1>🎵 DJ Assistant</h1>
    <p class="subtitle">Ask me to play something!</p>
    
    <div class="nowplaying" id="nowplaying">
        <div class="label">Now Playing</div>
        <div id="nowplaying-text">Loading...</div>
    </div>
    
    <div class="input-container">
        <input type="text" id="message" placeholder="e.g., play some jazz..." autofocus>
        <button onclick="sendChat()" id="sendBtn">Send</button>
    </div>
    
    <div class="quick-buttons">
        <button class="quick-btn" onclick="quickCmd('pause')">
            <span class="icon">⏸</span>
            <span>Pause</span>
        </button>
        <button class="quick-btn" onclick="quickCmd('resume')">
            <span class="icon">▶️</span>
            <span>Play</span>
        </button>
        <button class="quick-btn" onclick="quickCmd('skip')">
            <span class="icon">⏭</span>
            <span>Skip</span>
        </button>
        <button class="quick-btn" onclick="loadPlaylists()">
            <span class="icon">📚</span>
            <span>Playlists</span>
        </button>
        <button class="quick-btn" onclick="quickCmd('volume', 'up')">
            <span class="icon">🔊</span>
            <span>Vol +</span>
        </button>
        <button class="quick-btn" onclick="quickCmd('volume', 'down')">
            <span class="icon">🔉</span>
            <span>Vol -</span>
        </button>
        <button class="quick-btn" onclick="quickCmd('getqueue')">
            <span class="icon">📋</span>
            <span>Queue</span>
        </button>
        <button class="quick-btn" onclick="quickCmd('clearqueue')">
            <span class="icon">🗑</span>
            <span>Clear</span>
        </button>
    </div>
    

    <button class="sched-toggle" onclick="toggleSchedules()">⏰ Scheduled actions</button>

    <div class="sched-panel" id="sched-panel">
        <div class="sched-form">
            <input type="time" id="sched-time" value="07:00">
            <input type="text" id="sched-label" placeholder="name, e.g. Wake-up">
            <div class="sched-days" id="sched-days"></div>
            <select id="sched-action" onchange="schedActionChanged()">
                <option value="play">▶️ Play</option>
                <option value="pause">⏸ Pause</option>
                <option value="resume">▶️ Resume</option>
                <option value="skip">⏭ Skip</option>
                <option value="previous">⏮ Previous</option>
                <option value="volume">🔊 Set volume</option>
                <option value="clearqueue">🗑 Clear queue</option>
            </select>
            <input type="number" id="sched-volume" min="0" max="100" placeholder="volume">
            <select class="full" id="sched-uri" onchange="maybePasteUri(this)"></select>
            <button class="quick-btn full" onclick="addSchedule()">Create routine</button>
        </div>
        <div class="cal-toggle-row">
            <button id="view-list" class="on" onclick="setSchedView('list')">☰ List</button>
            <button id="view-cal" onclick="setSchedView('cal')">🗓 Week</button>
        </div>
        <div id="sched-list"></div>
        <div id="sched-cal" style="display:none"></div>

        <div class="sched-group">📻 STATIONS</div>
        <div id="stn-list"></div>
        <div class="sched-form" style="margin-top:8px">
            <input class="full" type="text" id="stn-name" placeholder="station name, e.g. Kim Fowley Radio">
            <input class="full" type="text" id="stn-uri" placeholder="spotify:playlist:37i9dQZF1E8…">
            <button class="quick-btn full" onclick="addStation()">Save station</button>
        </div>
    </div>

    <div class="status" id="status">🎧 What do you want to hear?</div>
    
    <div class="results" id="results"></div>
    
    <div class="sheet" id="sheet">
        <h3 id="sheet-title">Add to playlist</h3>
        <div id="sheet-body"></div>
        <button class="sheet-close" onclick="closeSheet()">Cancel</button>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Track, album, artist and playlist names come from Spotify and from
        // the Sonos queue -- anyone who can get a track into either controls
        // this text. Escape before it reaches innerHTML.
        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        refreshNowPlaying();
        setInterval(refreshNowPlaying, 30000);
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
        
        function refreshNowPlaying() {
            fetch('/nowplaying')
                .then(r => r.json())
                .then(data => {
                    const el = document.getElementById('nowplaying-text');
                    if (data.title && data.title !== 'Nothing playing') {
                        el.innerHTML = '<strong>' + escapeHtml(data.title) + '</strong> by ' + escapeHtml(data.artist);
                        loadAlbumTracks();
                    } else {
                        el.textContent = 'Nothing playing';
                    }
                })
                .catch(() => {
                    document.getElementById('nowplaying-text').textContent = 'Unable to fetch';
                });
        }
        
        document.getElementById('message').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendChat();
        });
        
        function loadAlbumTracks() {
            fetch('/album_tracks?based_on=nowplaying')
                .then(r => r.json())
                .then(data => {
                    if (data.error) return;
                    showAlbum(data);
                })
                .catch(() => {});
        }
        
        function showAlbum(data) {
            let html = '<div style="padding: 15px; display: flex; gap: 15px; align-items: flex-start; border-bottom: 1px solid rgba(255,255,255,0.1);">';
            if (data.artwork) {
                html += '<img src="' + escapeHtml(data.artwork) + '" style="width: 100px; height: 100px; border-radius: 8px;">';
            }
            html += '<div><div style="font-weight: bold; margin-bottom: 4px;">' + escapeHtml(data.album) + '</div>';
            html += '<div style="color: #888; font-size: 13px;">' + escapeHtml(data.artist) + ' • ' + escapeHtml(data.year) + '</div></div></div>';
            
            html += data.tracks.map(item => 
                '<div class="result-item">' +
                '<div class="result-num">' + item.num + '</div>' +
                '<div class="result-info">' +
                '<div class="song-name">' + escapeHtml(item.name) + '</div>' +
                '</div>' +
                '<div class="result-actions">' +
                '<button class="action-btn btn-play" onclick="trackAction(' + item.num + ', &quot;play&quot;)">▶️</button>' +
                '<button class="action-btn btn-next" onclick="trackAction(' + item.num + ', &quot;next&quot;)">⏭️</button>' +
                '<button class="action-btn btn-queue" onclick="trackAction(' + item.num + ', &quot;queue&quot;)">+</button>' +
                '</div>' +
                '</div>'
            ).join('');
            
            document.getElementById('results').innerHTML = html;
            document.getElementById('status').innerHTML = '💿 ' + escapeHtml(data.album);
        }

        function sendChat() {
            const input = document.getElementById('message');
            const message = input.value.trim();
            if (!message) return;
            
            document.getElementById('status').innerHTML = '💭 Thinking...';
            document.getElementById('status').classList.add('loading');
            
            fetch('/chat?message=' + encodeURIComponent(message))
                .then(r => r.json())
                .then(data => {
                    document.getElementById('status').classList.remove('loading');
                    document.getElementById('status').innerHTML = escapeHtml(data.message) || '✓ Done';
                    
                    if (data.results) {
                        showResults(data.results);
                    } else {
                        document.getElementById('results').innerHTML = '';
                    }
                    
                    if (data.action !== 'search') {
                        refreshNowPlaying();
                    }
                })
                .catch(err => {
                    document.getElementById('status').classList.remove('loading');
                    document.getElementById('status').innerHTML = '❌ Error: ' + escapeHtml(err.message);
                });
            
            input.value = '';
        }
        
        function showResults(results) {
            const html = results.map(item => 
                '<div class="result-item">' +
                '<div class="result-num">' + item.num + '</div>' +
                '<div class="result-info">' +
                '<div class="song-name">' + escapeHtml(item.name) + '</div>' +
                '<div class="artist-name">' + escapeHtml(item.artist) + (item.album ? ' • ' + escapeHtml(item.album) : '') + '</div>' +
                '</div>' +
                '<div class="result-actions">' +
                '<button class="action-btn btn-play" onclick="trackAction(' + item.num + ', &quot;play&quot;)">▶️</button>' +
                '<button class="action-btn btn-next" onclick="trackAction(' + item.num + ', &quot;next&quot;)">⏭️</button>' +
                '<button class="action-btn btn-queue" onclick="trackAction(' + item.num + ', &quot;queue&quot;)">+</button>' +
                '<button class="action-btn" onclick="openAddToPlaylist(' + item.num + ')" title="Add to playlist">➕</button>' +
                '</div>' +
                '</div>'
            ).join('');
            document.getElementById('results').innerHTML = html;
        }
        
        function trackAction(num, action) {
            const endpoint = '/' + action + '?num=' + num;
            const messages = {
                'play': '▶️ Playing now...',
                'next': '⏭️ Playing next...',
                'queue': '➕ Adding to queue...'
            };
            
            showToast(messages[action]);
            
            fetch(endpoint)
                .then(r => r.json())
                .then(data => {
                    if (data.item) {
                        const actionText = {
                            'play': '▶️ Now playing: ',
                            'next': '⏭️ Up next: ',
                            'queue': '➕ Queued: '
                        };
                        document.getElementById('status').innerHTML = actionText[action] + escapeHtml(data.item.name);
                        if (action === 'play') {
                            refreshNowPlaying();
                        }
                    } else {
                        document.getElementById('status').innerHTML = '❌ ' + escapeHtml(data.error || 'Failed');
                    }
                });
        }
        
        function quickCmd(cmd, arg) {
            let url = '/' + cmd;
            if (cmd === 'volume') {
                url = '/volume?change=' + (arg === 'up' ? '%2B10' : '-10');
            }
            
            fetch(url)
                .then(r => r.json())
                .then(data => {
                    if (cmd === 'getqueue') {
                        showQueue(data.queue || []);
                    } else {
                        showToast('✓ ' + (data.status || 'Done'));
                        refreshNowPlaying();
                    }
                });
        }
        
        function showQueue(queue) {
            if (!queue.length) {
                document.getElementById('status').innerHTML = '📭 Queue is empty';
                document.getElementById('results').innerHTML = '';
                return;
            }
            document.getElementById('status').innerHTML = '📋 Current queue (' + queue.length + ' tracks)';
            const html = queue.slice(0, 10).map((item, i) => 
                '<div class="result-item">' +
                '<div class="result-num">' + (i + 1) + '</div>' +
                '<div class="result-info">' +
                '<div class="song-name">' + escapeHtml(item.title) + '</div>' +
                '<div class="artist-name">' + escapeHtml(item.artist) + '</div>' +
                '</div></div>'
            ).join('');
            document.getElementById('results').innerHTML = html;
        }
        
        function loadPlaylists() {
            document.getElementById('status').innerHTML = '📚 Loading playlists...';
            fetch('/my/playlists?limit=50')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('status').innerHTML = '📚 Your Playlists (' + data.your_playlists.length + ')';
                    showPlaylists(data.your_playlists);
                })
                .catch(err => {
                    document.getElementById('status').innerHTML = '❌ Error loading playlists';
                });
        }
        
        function showPlaylists(playlists) {
            const html = playlists.map(item => 
                '<div class="result-item">' +
                '<div class="result-num">' + item.num + '</div>' +
                '<div class="result-info">' +
                '<div class="song-name">' + escapeHtml(item.name) + '</div>' +
                '<div class="artist-name">' + escapeHtml(item.tracks) + ' tracks</div>' +
                '</div>' +
                '<div class="result-actions">' +
                '<button class="action-btn btn-play" onclick="playPlaylist(' + item.num + ')">▶️</button>' +
                '</div>' +
                '</div>'
            ).join('');
            document.getElementById('results').innerHTML = html;
        }
        
        function playPlaylist(num) {
            showToast('▶️ Starting playlist...');
            fetch('/play?num=' + num)
                .then(r => r.json())
                .then(data => {
                    if (data.status) {
                        document.getElementById('status').innerHTML = '▶️ Playing playlist';
                        refreshNowPlaying();
                    } else {
                        document.getElementById('status').innerHTML = '❌ ' + escapeHtml(data.error || 'Failed');
                    }
                });
        }

        // ---- Schedules ----
        const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        const ACTION_ICON = {
            play: '▶', pause: '⏸', resume: '▶', skip: '⏭',
            previous: '⏮', volume: '🔊', clearqueue: '🗑',
        };

        function buildDayPicker() {
            document.getElementById('sched-days').innerHTML = DAY_NAMES.map((d, i) =>
                '<label><input type="checkbox" class="sched-day" value="' + i + '">' +
                '<span>' + d + '</span></label>'
            ).join('');
        }

        function toggleSchedules() {
            const panel = document.getElementById('sched-panel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                loadSources().then(() => {
                    renderStations();
                    document.getElementById('sched-uri').innerHTML = sourceOptions('');
                    loadSchedules();
                });
            }
        }

        function schedActionChanged() {
            const action = document.getElementById('sched-action').value;
            document.getElementById('sched-uri').style.display = action === 'play' ? '' : 'none';
            document.getElementById('sched-volume').style.display =
                (action === 'play' || action === 'volume') ? '' : 'none';
        }

        // Routines are grouped by the days they run, because that is how you
        // think about them -- "my weekday mornings", not "the 07:00 one".
        function groupName(days) {
            const key = (days || []).join(',');
            if (key === '' || key === '0,1,2,3,4,5,6') return 'EVERY DAY';
            if (key === '0,1,2,3,4') return 'WEEKDAYS';
            if (key === '5,6') return 'WEEKENDS';
            return days.map(d => DAY_NAMES[d]).join(' ').toUpperCase();
        }

        function describeStep(step) {
            const icon = ACTION_ICON[step.action] || '•';
            let what = step.action;
            if (step.action === 'play') {
                what = 'play ' + (step.uri || '');
                if (step.volume !== undefined && step.volume !== null) {
                    what += '  · vol ' + step.volume;
                }
            } else if (step.action === 'volume') {
                what = 'volume ' + step.volume;
            }
            return icon + '  ' + what;
        }

        function renderRoutine(s) {
            const steps = (s.steps || []).map((step, i) =>
                '<div class="sched-step">' +
                    '<span class="off">+' + escapeHtml(String(step.offset || 0)) + 'm</span>' +
                    '<span class="what">' + escapeHtml(describeStep(step)) + '</span>' +
                    '<button class="link-btn" title="Remove step" ' +
                        'onclick="deleteStep(\'' + s.id + '\',' + i + ')">✕</button>' +
                '</div>'
            ).join('');

            const stepForm =
                '<div class="sched-addstep" id="addstep-' + s.id + '">' +
                    '<input type="number" min="0" placeholder="+min" id="stepoff-' + s.id + '" value="0">' +
                    '<select id="stepact-' + s.id + '">' +
                        Object.keys(ACTION_ICON).map(a =>
                            '<option value="' + a + '">' + ACTION_ICON[a] + ' ' + a + '</option>').join('') +
                    '</select>' +
                    '<input type="number" min="0" max="100" placeholder="volume" id="stepvol-' + s.id + '">' +
                    '<select class="full" id="stepuri-' + s.id + '" ' +
                        'onchange="maybePasteUri(this)">' + sourceOptions('') + '</select>' +
                    '<button class="quick-btn full" onclick="addStep(\'' + s.id + '\')">Add step</button>' +
                '</div>';

            return '<div class="sched-routine' + (s.enabled ? '' : ' sched-off') + '">' +
                '<div class="sched-head">' +
                    '<div class="sched-when">' + escapeHtml(s.time) + '</div>' +
                    '<div class="sched-title"><div class="name">' +
                        escapeHtml(s.label || '(unnamed)') + '</div></div>' +
                    '<button title="Enable/disable" onclick="toggleSchedule(\'' + s.id + '\')">' +
                        (s.enabled ? '🔔' : '🔕') + '</button>' +
                    '<button title="Run now" onclick="runSchedule(\'' + s.id + '\')">⚡</button>' +
                    '<button title="Delete" onclick="deleteSchedule(\'' + s.id + '\')">🗑</button>' +
                '</div>' +
                '<div class="sched-steps">' + steps +
                    '<button class="link-btn" onclick="toggleStepForm(\'' + s.id + '\')">+ step</button>' +
                '</div>' + stepForm +
            '</div>';
        }

        function loadSchedules() {
            fetch('/schedules')
                .then(r => r.json())
                .then(data => {
                    const list = data.schedules || [];
                    if (!list.length) {
                        document.getElementById('sched-list').innerHTML =
                            '<div class="sched-meta" style="padding:12px">Nothing scheduled yet.</div>';
                        return;
                    }
                    const groups = {};
                    list.forEach(s => {
                        const g = groupName(s.days);
                        (groups[g] = groups[g] || []).push(s);
                    });
                    const order = ['WEEKDAYS', 'WEEKENDS', 'EVERY DAY'];
                    const names = Object.keys(groups).sort((a, b) => {
                        const ia = order.indexOf(a), ib = order.indexOf(b);
                        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
                    });
                    document.getElementById('sched-list').innerHTML = names.map(g =>
                        '<div class="sched-group">' + escapeHtml(g) + '</div>' +
                        groups[g].sort((a, b) => a.time.localeCompare(b.time))
                                 .map(renderRoutine).join('')
                    ).join('');
                });
        }

        function schedPost(path, body) {
            return fetch(path, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: body,
            }).then(r => r.json().then(data => ({ok: r.ok, data})));
        }

        function addSchedule() {
            const days = [...document.querySelectorAll('.sched-day:checked')]
                .map(c => c.value).join(',');
            const params = new URLSearchParams({
                time: document.getElementById('sched-time').value,
                days: days,
                label: document.getElementById('sched-label').value.trim(),
                action: document.getElementById('sched-action').value,
                uri: document.getElementById('sched-uri').value.trim(),
                volume: document.getElementById('sched-volume').value,
            });
            schedPost('/schedule_add', params.toString()).then(({ok, data}) => {
                if (!ok) { showToast('❌ ' + (data.error || 'Could not add')); return; }
                showToast('⏰ Routine created');
                document.getElementById('sched-label').value = '';
                loadSchedules();
            });
        }

        function toggleStepForm(id) {
            document.getElementById('addstep-' + id).classList.toggle('open');
        }

        function addStep(id) {
            const params = new URLSearchParams({
                id: id,
                offset: document.getElementById('stepoff-' + id).value || '0',
                action: document.getElementById('stepact-' + id).value,
                volume: document.getElementById('stepvol-' + id).value,
                uri: document.getElementById('stepuri-' + id).value.trim(),
            });
            schedPost('/schedule_step_add', params.toString()).then(({ok, data}) => {
                if (!ok) { showToast('❌ ' + (data.error || 'Could not add step')); return; }
                loadSchedules();
            });
        }

        function deleteStep(id, index) {
            schedPost('/schedule_step_delete', 'id=' + encodeURIComponent(id) + '&index=' + index)
                .then(() => loadSchedules());
        }

        function deleteSchedule(id) {
            schedPost('/schedule_delete', 'id=' + encodeURIComponent(id))
                .then(() => { showToast('🗑 Deleted'); loadSchedules(); });
        }

        function toggleSchedule(id) {
            schedPost('/schedule_toggle', 'id=' + encodeURIComponent(id))
                .then(() => loadSchedules());
        }

        function runSchedule(id) {
            schedPost('/schedule_run', 'id=' + encodeURIComponent(id))
                .then(({ok, data}) => showToast(ok ? '⚡ Ran it' : '❌ ' + (data.error || 'Failed')));
        }


        // ---- Sources: your playlists + saved stations ----
        // Cached because the step picker, the calendar and the add-to-playlist
        // sheet all need them, and /my hits the Spotify API each time.
        let PLAYLISTS = [];
        let STATIONS = [];

        function loadSources() {
            return Promise.all([
                fetch('/my?action=playlists&limit=50').then(r => r.json()).catch(() => ({})),
                fetch('/stations').then(r => r.json()).catch(() => ({})),
            ]).then(([pl, st]) => {
                PLAYLISTS = pl.your_playlists || [];
                STATIONS = st.stations || [];
            });
        }

        function sourceOptions(selected) {
            const opt = (uri, label) =>
                '<option value="' + escapeHtml(uri) + '"' +
                (uri === selected ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
            let html = '<option value="">— choose —</option>';
            if (PLAYLISTS.length) {
                html += '<optgroup label="my playlists">' +
                    PLAYLISTS.map(p => opt(p.uri, p.name)).join('') + '</optgroup>';
            }
            if (STATIONS.length) {
                html += '<optgroup label="stations">' +
                    STATIONS.map(s => opt(s.uri, '📻 ' + s.name)).join('') + '</optgroup>';
            }
            html += '<option value="__paste__">✎ paste a URI…</option>';
            return html;
        }

        // ---- Stations ----
        function renderStations() {
            const el = document.getElementById('stn-list');
            if (!STATIONS.length) {
                el.innerHTML = '<div class="cal-empty">No stations yet. In Spotify: right-click a ' +
                    'song → Go to Song Radio → Share → Copy link, then paste it below.</div>';
                return;
            }
            el.innerHTML = STATIONS.map(s =>
                '<div class="stn-item">' +
                    '<div class="stn-name">📻 ' + escapeHtml(s.name) + '</div>' +
                    '<button title="Play now" onclick="playUri(\'' + escapeHtml(s.uri) + '\')">▶</button>' +
                    '<button title="Queue" onclick="queueUri(\'' + escapeHtml(s.uri) + '\')">⏭</button>' +
                    '<button title="Delete" onclick="deleteStation(\'' + s.id + '\')">🗑</button>' +
                '</div>'
            ).join('');
        }

        function addStation() {
            const name = document.getElementById('stn-name').value.trim();
            const uri = document.getElementById('stn-uri').value.trim();
            schedPost('/station_add', new URLSearchParams({name, uri}).toString())
                .then(({ok, data}) => {
                    if (!ok) { showToast('❌ ' + (data.error || 'Could not save')); return; }
                    document.getElementById('stn-name').value = '';
                    document.getElementById('stn-uri').value = '';
                    showToast('📻 Station saved');
                    loadSources().then(renderStations);
                });
        }

        function deleteStation(id) {
            schedPost('/station_delete', 'id=' + encodeURIComponent(id))
                .then(() => loadSources().then(renderStations));
        }

        function playUri(uri) {
            fetch('/play?uri=' + encodeURIComponent(uri)).then(r => r.json()).then(d => {
                showToast(d.error ? '❌ ' + d.error : '▶️ Playing');
                refreshNowPlaying();
            });
        }

        function queueUri(uri) {
            fetch('/queue?uri=' + encodeURIComponent(uri)).then(r => r.json()).then(d => {
                showToast(d.error ? '❌ ' + d.error : '➕ Queued');
            });
        }

        // ---- Add to playlist ----
        let sheetTrackNum = null;

        function openAddToPlaylist(num) {
            sheetTrackNum = num;
            document.getElementById('sheet-title').textContent = 'Add to playlist';
            const body = PLAYLISTS.length
                ? PLAYLISTS.map(p =>
                    '<div class="sheet-item" onclick="addToPlaylist(\'' +
                    escapeHtml(p.uri) + '\')">' + escapeHtml(p.name) +
                    '  <span style="color:#777">· ' + escapeHtml(String(p.tracks)) + '</span></div>').join('')
                : '<div class="cal-empty">No playlists found.</div>';
            document.getElementById('sheet-body').innerHTML = body +
                '<div class="sheet-item" onclick="createPlaylistThenAdd()">＋ New playlist…</div>';
            document.getElementById('sheet').classList.add('open');
        }

        function closeSheet() {
            document.getElementById('sheet').classList.remove('open');
        }

        function addToPlaylist(playlistUri) {
            const id = playlistUri.split(':').pop();
            schedPost('/add_to_playlist',
                new URLSearchParams({playlist_id: id, num: sheetTrackNum}).toString())
                .then(({ok, data}) => {
                    closeSheet();
                    showToast(ok ? '✅ Added' : '❌ ' + (data.error || 'Failed'));
                });
        }

        function createPlaylistThenAdd() {
            const name = prompt('New playlist name');
            if (!name) return;
            schedPost('/create_playlist', new URLSearchParams({name}).toString())
                .then(({ok, data}) => {
                    if (!ok) { showToast('❌ ' + (data.error || 'Failed')); return; }
                    loadSources().then(() => addToPlaylist(data.uri));
                });
        }

        // ---- Weekly calendar ----
        function setSchedView(which) {
            const isCal = which === 'cal';
            document.getElementById('sched-list').style.display = isCal ? 'none' : '';
            document.getElementById('sched-cal').style.display = isCal ? '' : 'none';
            document.getElementById('view-cal').classList.toggle('on', isCal);
            document.getElementById('view-list').classList.toggle('on', !isCal);
            if (isCal) renderCalendar();
        }

        function renderCalendar() {
            fetch('/schedules').then(r => r.json()).then(data => {
                const list = (data.schedules || []).filter(s => s.enabled);
                const el = document.getElementById('sched-cal');
                if (!list.length) {
                    el.innerHTML = '<div class="cal-empty">Nothing enabled to show.</div>';
                    return;
                }
                // One row per trigger time; a routine occupies the days it runs.
                const times = [...new Set(list.map(s => s.time))].sort();
                // JS getDay() is Sunday-based; the scheduler is Monday-based.
                const todayIdx = (new Date().getDay() + 6) % 7;

                let html = '<table class="cal"><tr><th></th>' +
                    DAY_NAMES.map((d, i) =>
                        '<th class="' + (i === todayIdx ? 'today' : '') + '">' + d + '</th>').join('') +
                    '</tr>';

                times.forEach(t => {
                    html += '<tr><td class="time">' + escapeHtml(t) + '</td>';
                    for (let d = 0; d < 7; d++) {
                        const here = list.filter(s =>
                            s.time === t && ((s.days || []).length === 0 || s.days.includes(d)));
                        if (!here.length) {
                            html += '<td class="miss">·</td>';
                        } else {
                            const icons = here.map(s =>
                                (s.steps || []).map(st => ACTION_ICON[st.action] || '•').join('')
                            ).join(' ');
                            const names = here.map(s => s.label || '(unnamed)').join(', ');
                            html += '<td class="hit" title="' + escapeHtml(names) + '" ' +
                                'onclick="showToast(\'' + escapeHtml(t + ' · ' + names) + '\')">' +
                                escapeHtml(icons) + '</td>';
                        }
                    }
                    html += '</tr>';
                });
                el.innerHTML = html + '</table>' +
                    '<div class="cal-empty">Tap a cell for its name. Disabled routines are hidden.</div>';
            });
        }

        function maybePasteUri(sel) {
            if (sel.value !== '__paste__') return;
            const v = prompt('Paste a Spotify URI (playlist, album or Song Radio)');
            if (!v) { sel.value = ''; return; }
            // Keep it selectable afterwards by adding it as a real option.
            const opt = document.createElement('option');
            opt.value = v.trim();
            opt.textContent = '✎ ' + v.trim();
            sel.insertBefore(opt, sel.lastElementChild);
            sel.value = v.trim();
        }

        buildDayPicker();
        schedActionChanged();
    </script>
</body>
</html>
